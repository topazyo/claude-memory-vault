name: checks

# The vault ships two checkers and a control suite. Running them here is what
# keeps the portability claims in the README honest: the hooks are bash and are
# advertised as working on Linux, macOS and Git Bash on Windows, so all three
# are exercised on every push rather than trusted.
#
# The macOS job matters most. macOS ships BSD userland (no `grep -P`) and bash
# 3.2 from 2007 as /bin/bash, and neither `jq` nor GNU coreutils are present by
# default. Those differences are invisible on a Linux developer machine, and
# every portability defect this repo has had so far failed in the quiet
# direction - reporting "clean" while scanning nothing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A hung step must fail the build in minutes, not hold a runner for the
    # six-hour GitHub default. The suite takes a minute on Linux and macOS and
    # several on Windows, where process start-up is slow. Windows was already
    # using 18.5 of 30 minutes before the retention controls, and those build
    # roughly fifteen more git repositories, so the limit was 45 to leave the
    # margin a hung step still needs to be caught in.
    #
    # 60 rather than 45, for one unexplained overrun rather than for a cost
    # anybody has measured. The reasoning is written out because the first
    # attempt at it was wrong and a later reader should not repeat it.
    #
    # One Windows run was cancelled against the 45 limit after 55 minutes. The
    # commit it ran on had just added a control that blinds ps so a stop is
    # recorded as unknown, and on Git Bash that sends the stop down a PowerShell
    # fallback this repository records as sometimes taking over a minute, so the
    # control looked like the cause. It is not. The next run carried that
    # control and a second pair doing the same thing, and Windows finished in
    # 33m01s, against 33m04s on the commit before any of them existed. Linux was
    # 5m27s and 5m04s across the same two, which is no change either. So the
    # controls cost almost nothing on any platform and the 55 minute run remains
    # unexplained, most likely a slow runner.
    #
    # 60 covers that observed outlier and still catches a genuinely hung step in
    # an hour rather than the six hour default. Raising it further would buy
    # nothing, since nothing measured comes close.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Report the environment
        shell: bash
        run: |
          echo "bash:  $BASH_VERSION"
          echo "uname: $(uname -s)"
          # The locale is reported because a range in a shell pattern is read in
          # the collating order of whichever one the job happens to have, and two
          # defects of exactly that shape reached main without anyone being able
          # to see which locale had produced them.
          echo "locale:"
          locale 2>&1 | sed 's/^/  /' || echo "  locale: MISSING"
          echo "awk version:"
          awk --version 2>&1 | head -n 1 | sed 's/^/  /' || awk -W version 2>&1 | head -n 1 | sed 's/^/  /' || echo "  unknown"
          for t in jq perl awk sed find date; do
            printf '%-6s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done

      # jq is deliberately NOT installed. It is absent by default on macOS and in
      # Git for Windows, and the hook is written to degrade loudly without it.
      # Installing it here would hide exactly the case most users will hit.

      # strace is installed, and only on this one job. The process-budget
      # control counts the processes a lint call starts and skips without it,
      # so leaving it out meant the single control that proves the hook-cost
      # change did anything never ran on any job, silently. That is the
      # opposite case to jq above: jq absent is a user's real configuration and
      # worth testing, strace absent only blinds the suite.
      - name: Install strace for the process budget
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace

      # No locale is generated for the collating control, and the reason is
      # worth writing down because generating one looks like the obvious fix
      # and was tried here. bash 5 sets globasciiranges by default, which holds
      # range expressions to ASCII whatever the locale says, so on this image
      # the range the control asks about cannot be moved by any locale. The
      # locale really was generated in run 35491897527 and the control skipped
      # anyway. Only the two macOS jobs can ask the question, because macOS
      # ships bash 3.2 as /bin/bash and that predates the option, which is why
      # they are the only jobs that require the control.

      # A platform-gated control that skipped proves nothing on that platform,
      # so each job names the controls that must have run on its system. The
      # suite fails a named control that printed SKIP or never ran.
      - name: Control suite
        shell: bash
        env:
          # Three lists, not two, because the controls added with the fence,
          # retention and hook-cost changes do not all reach every platform.
          # Windows reads a backslash in a name as a folder separator, so the
          # two that need such a name skip there, only this ubuntu job has
          # strace for the process budget, and only its filesystem keeps two
          # names that differ in case apart, which promo-create-only-twinguards
          # needs. Naming a control that legitimately
          # skips would fail the job for the wrong reason, and naming none of
          # them is how they came to skip everywhere unnoticed.
          RUN_TESTS_REQUIRED: ${{ matrix.os == 'windows-latest' && 'win-native-tree noncesweep win-sweep-report win-orphan-stop win-fork-stop signal-scope runlog-tmp-case retention-junction crlf-blob-preserved fence-cksum-unescape logger-not-registered logger-optin-snippet commit-window-not-reverted settings-hooks-present logger-records-session-start vtab-fence-agrees jq-crlf-output logger-crlf scan-upper-case scan-case-not-widened collating-range-probe collating-range-scan stub-nul-refused verify-diff-watchdog steering-locale-fold legacy-asks-the-adding-commit destination-staged-only tripwire-says-rename-outcome trailer-path-set head-holds-unknown tmpl-unclassified-fails tmpl-manifest-stale tmpl-generate-guarded tmpl-binary-refused tmpl-three-answers tmpl-status-unknown tmpl-vacuous tmpl-hostile-manifest-narrows tmpl-path-escape tmpl-collision-not-safe tmpl-user-note-untouched tmpl-source-older tmpl-same-version-disagrees tmpl-crlf-agrees tmpl-lone-cr-modified tmpl-tripwire-refused tmpl-pass-in-flight tmpl-no-hash-tool tmpl-no-execution-from-source tmpl-class-table tmpl-changelog-adopting tmpl-version-agrees tmpl-merge-not-safe tmpl-tripwire-state-copy tmpl-shipped-rules-have-no-catchall tmpl-vault-check-line tmpl-narrowing-vectors tmpl-exempt-set-matches-the-tree tmpl-source-vacuous tmpl-source-disagrees tmpl-adopt-writes-one-file tmpl-version-filtered tmpl-generate-under-tripwire tmpl-exempt-set-is-behavioural tmpl-converged-not-a-merge tmpl-already-adopted tmpl-offered-is-a-plan tmpl-unknown-algorithm tmpl-source-not-a-template tmpl-adopt-rebuilds-manifest tmpl-adopt-names-what-is-absent tmpl-claims-your-folder tmpl-rules-character tmpl-generate-needs-a-version tmpl-retired-listed tmpl-seed-verdicts-counted tmpl-same-version-equivalent tmpl-plan-quoting tmpl-verify-manifest-guarded tmpl-fixtures-built tmpl-release-owed tmpl-release-in-preparation tmpl-release-tag-spelling tmpl-release-cut tmpl-missing-tracked tmpl-unwritable-name tmpl-case-collision tmpl-rules-r