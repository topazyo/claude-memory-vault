        run: bash .claude/scripts/run-tests.sh

      # vault-check.sh exits 2 when it scans zero notes, so a path-resolution
      # regression fails this step on its own and no separate vacuity check is
      # needed. The 2 rather than a 1 is the point of the code, since it says
      # the checker could not run rather than that a note in this repository is
      # wrong, and those two would want different things done about them.
      - name: Frontmatter invariants
        shell: bash
        run: bash .claude/scripts/vault-check.sh

  bash32:
    name: macOS with system bash 3.2
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # macOS ships bash 3.2.57 as /bin/bash because Apple would not ship GPLv3,
      # and `#!/usr/bin/env bash` picks it up unless the user installed a newer
      # one. Invoking /bin/bash explicitly pins the oldest interpreter the
      # scripts claim to support, so a bash-4-only construct fails here rather
      # than in a stranger's terminal.
      - name: Confirm this really is bash 3.2
        run: /bin/bash -c 'echo "$BASH_VERSION"'

      - name: Control suite under bash 3.2
        env:
          # No strace on macOS, so the process budget is not named here. The
          # rest reach this job and the bash 3.2 reading of them is the whole
          # reason this job exists.
          RUN_TESTS_REQUIRED: groupkill symlink run-log-link run-log-dirlink reaped-group line-break-name signal-scope runlog-tmp-case keep-output-dirlink tripwire-name keep-output-fifo retention-symlink crlf-blob-preserved fence-cksum-unescape fence-backslash-name logger-not-registered logger-optin-snippet commit-window-not-reverted settings-hooks-present logger-records-session-start vtab-fence-agrees jq-crlf-output logger-crlf scan-trailing-dot scan-upper-case scan-case-not-widened collating-range-probe collating-range-scan locale-collation-verdicts stub-nul-refused verify-diff-watchdog legacy-asks-the-adding-commit destination-staged-only tripwire-says-rename-outcome trailer-path-set head-holds-unknown tmpl-unclassified-fails tmpl-manifest-stale tmpl-generate-guarded tmpl-binary-refused tmpl-three-answers tmpl-status-unknown tmpl-vacuous tmpl-hostile-manifest-narrows tmpl-path-escape tmpl-collision-not-safe tmpl-user-note-untouched tmpl-source-older tmpl-same-version-disagrees tmpl-crlf-agrees tmpl-lone-cr-modified tmpl-tripwire-refused tmpl-pass-in-flight tmpl-no-hash-tool tmpl-no-execution-from-source tmpl-class-table tmpl-changelog-adopting tmpl-version-agrees tmpl-merge-not-safe tmpl-tripwire-state-copy tmpl-shipped-rules-have-no-catchall tmpl-vault-check-line tmpl-narrowing-vectors tmpl-exempt-set-matches-the-tree tmpl-source-vacuous tmpl-source-disagrees tmpl-adopt-writes-one-file tmpl-version-filtered tmpl-generate-under-tripwire tmpl-exempt-set-is-behavioural tmpl-converged-not-a-merge tmpl-already-adopted tmpl-offered-is-a-plan tmpl-unknown-algorithm tmpl-source-not-a-template tmpl-adopt-rebuilds-manifest tmpl-adopt-names-what-is-absent tmpl-claims-your-folder tmpl-rules-character tmpl-generate-needs-a-version tmpl-retired-listed tmpl-seed-verdicts-counted tmpl-same-version-equivalent tmpl-plan-quoting tmpl-verify-manifest-guarded tmpl-unreadable-not-deleted tmpl-source-symlink tmpl-fixtures-built tmpl-release-owed tmpl-release-in-preparation tmpl-release-tag-spelling tmpl-release-cut tmpl-missing-tracked tmpl-unwritable-name tmpl-case-collision tmpl-rules-refused tmpl-hash-tool-named tmpl-hash-tool-misbehaves tmpl-no-diff-tool tmpl-no-source tmpl-in-flight-state-copy tmpl-plan-digests tmpl-release-version-spelling tmpl-release-comparators-agree tmpl-release-cannot-look tmpl-release-ignores-git-dir tmpl-release-vacuous tmpl-release-tag-without-manifest tmpl-release-reclassified tmpl-release-tag-failed tmpl-release-scratch-survivor tmpl-release-shipped-unknown-sides tmpl-release-unwritten-not-empty tmpl-hash-count tmpl-source-unreadable tmpl-source-dir-symlink promo-create-only-edit promo-create-only-supersede promo-create-only-stamp promo-create-only-reverse promo-create-only-wiki promo-create-only-ignored promo-create-only-failpath promo-create-only-timeout promo-create-only-leftover promo-create-only-syncnew promo-create-only-arms promo-create-only-passnote promo-create-only-globnew promo-create-only-casetwin promo-create-only-outside promo-create-only-contained promo-create-only-hangoutside
        run: /bin/bash .claude/scripts/run-tests.sh

      - name: Frontmatter invariants under bash 3.2
        run: /bin/bash .claude/scripts/vault-check.sh

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth 0, for the release check below and for nothing else in this
      # job. The default shallow checkout carries no tags, and a checkout with
      # no tags looks exactly like a project that has never released one, so
      # the check would report "could not determine" on every run and a reader
      # would learn to expect that from a healthy repository.
      # persist-credentials false because nothing in this job needs network
      # git. Every step here is local, and the default leaves this job's token
      # in .git/config as an http extraheader, inside the very directory the
      # release check below has just started writing scratch files into. It
      # costs nothing to take it out, and it matters more now that fetch-depth
      # is 0, which materialises the whole history and every tag on a runner
      # that also executes shell a fork's pull request supplied.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The release has to advance with the repository, and until this step
      # existed nothing made it. `vault-update.sh` tells a vault what moved by
      # comparing manifests, and `docs/updating.md` tells the reader to hear
      # about a newer copy by watching this repository's releases. A merge that
      # edited a shipped file, left VERSION alone and was never tagged produced
      # a template whose newest content no vault could discover, while the
      # manifest still verified and this workflow still went green.
      #
      # THIS STEP IS NOT PATH FILTERED, and that is deliberate rather than
      # incidental. A path filtered step shows as skipped on a pull request
      # that touches nothing matching the filter, and a reviewer reading the
      # checks list cannot tell a skip from a pass. This runs on every pull
      # request and every push to main, and it reports counts either way.
      #
      # The one guard is by repository, which is the same guard the manifest
      # verification step carries and it is there for the same reason. "Use
      # this template" copies this workflow into somebody's own repository,
      # where their notes are shipped files by class and their releases are
      # their own business, and this step would go red for ever on a vault that
      # is working perfectly. On a pull request from a fork, github.repository
      # is still this repository, so a contributor's change is checked here.
      #
      # --release-branch only on a push to main, because a version that names
      # no tag is a release in preparation on a pull request and a debt on the
      # branch releases are cut from. Tagging does not re-trigger this workflow,
      # so the way to clear that red is to cut the tag and re-run this job.
      # The guard has the same skip-invisibility the comment above objects to in
      # a path filter, and saying so is better than pretending otherwise. Rename
      # or transfer this repository and this step skips for ever while the job
      # stays green. It is still the right guard, because the alternative is a
      # step that goes red for ever in somebody's vault, and the manifest step
      # below carries the same one. What makes it tolerable is that it names a
      # repository rather than a set of paths, so it changes only when somebody
      # moves the repository, and that is a thing a person does deliberately.
      #
      # THE TWO FAILING EXITS ARE SEPARATED. The script spends real effort
      # keeping 1, a release is owed, apart from 2, this check could not run and
      # is saying nothing, and a bare `run:` collapses both into "process
      # completed with exit code N". That matters most in the case that is
      # easiest to get wrong: drop fetch-depth and the answer becomes NO-TAGS on
      # 2, which looks like an ordinary red, and the usual response to a red
      # release check is to weaken it.
      - name: The release keeps up with what this template ships
        if: github.repository == 'topazyo/claude-memory-vault'
        run: |
          # The status is captured with `|| rc=$?` rather than read from $? on
          # the next line, because a workflow run block is bash -e and a bare
          # non-zero exit inside the if-body would end the step before anything
          # could look at it. A command on the left of || is exempt from that.
          rc=0
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            bash .github/release-check.sh --release-branch || rc=$?
          else
            bash .github/release-check.sh || rc=$?
          fi
          case "$rc" in
            0) exit 0 ;;
            1) echo "::error title=A release is owed::The tree ships something no published release carries. Read the output above, then cut the release as CONTRIBUTING.md describes."; exit 1 ;;
            2) echo "::error title=The release check could not run::This is NOT saying a release is owed and it is NOT saying one is not. Something stopped the check from answering, most often a checkout carrying no tags. Read the output above before changing anything."; exit 1 ;;
            *) echo "::error title=The release check failed unexpectedly::It left on $rc, which it does not document. Read the output above."; exit 1 ;;
          esac

      - name: Every shell script parses
        run: |
          rc=0
          # Git hooks have no .sh extension, so they are listed separately.
          for f in $(git ls-files '*.sh' '.claude/githooks/*'); do
            bash -n "$f" || { echo "::error file=$f::syntax error"; rc=1; }
          done
          exit $rc

      # Advisory, not gating. Several warnings here would be deliberate - the
      # word splitting in `for d in $TIERS` is intended, for instance - and a
      # build that fails on a style opinion trains people to ignore the build.
      # Read the output, silence what is genuinely intentional with a
      # `# shellcheck disable=` comment and a reason, then make this gating.
      - name: shellcheck (advisory)
        continue-on-error: true
        run: |
          shellcheck --version
          for f in $(git ls-files '*.sh' '.claude/githooks/*'); do
            echo "--- $f"
            shellcheck --severity=warning "$f" || true
          done

      - name: Every JSON file parses
        run: |
          rc=0
          for f in $(git ls-files '*.json'); do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              || { echo "::error file=$f::invalid JSON"; rc=1; }
          done
          exit $rc

      # OpenCode runs every file in .opencode/plugins/ at startup without a trust
      # prompt, so the template must never ship one there: anyone opening a
      # clone would run it. The plugin lives in .claude/adapters/ and a user
      # copies it in deliberately (docs/harnesses/opencode.md).
      - name: The OpenCode plugin ships opt-in
        run: |
          if [ -n "$(git ls-files '.opencode/plugins/*')" ]; then
            echo "::error::.opencode/plugins/ is tracked; the template must ship the OpenCode plugin opt-in"
            exit 1
          fi

      # The shipped harness configs are only useful if their harness can parse
      # them, and a syntax error in each fails silently: the harness skips the
      # file and runs with no hooks at all.
      - name: Harness configs parse (TOML, YAML, plugin JavaScript)
        run: |
          rc=0
          for f in $(git ls-files '*.toml'); do
            python3 -c "import tomllib,sys; tomllib.load(open(sys.argv[1],'rb'))" "$f" \
              || { echo "::error file=$f::invalid TOML"; rc=1; }
          done
          for f in $(git ls-files '*.yml' '*.yaml'); do
            ruby -ryaml -e 'YAML.load_file(ARGV[0])' "$f" \
              || { echo "::error file=$f::invalid YAML"; rc=1; }
          done
          # The plugin is an ES module; Node parses it as one only under .mjs.
          for f in $(git ls-files '.claude/adapters/*.js'); do
            cp "$f" "$RUNNER_TEMP/plugin-check.mjs"
            node --check "$RUNNER_TEMP/plugin-check.mjs" \
              || { echo "::error file=$f::invalid JavaScript"; rc=1; }
          done
          exit $rc

      # Windows has no executable bit, so scripts committed from a Windows
      # machine land as 100644 and `./script.sh` fails on a Linux clone.
      - name: Shell scripts are executable in the index
        run: |
          rc=0
          for f in $(git ls-files '*.sh' '.claude/githooks/*'); do
            mode=$(git ls-files -s "$f" | cut -d' ' -f1)
            [ "$mode" = "100755" ] || { echo "::error file=$f::mode $mode, expected 100755"; rc=1; }
          done
          exit $rc

      # A skill without a name: key silently never registers, which is the worst
      # kind of breakage - nothing errors, the skill simply does not exist.
      - name: Skills and agents declare their frontmatter keys
        run: |
          rc=0
          for f in $(git ls-files '.claude/skills/*/SKILL.md'); do
            grep -q '^name:' "$f" || { echo "::error file=$f::missing name: key"; rc=1; }
          done
          for f in $(git ls-files '.claude/agents/*.md'); do
            grep -q '^name:' "$f"  || { echo "::error file=$f::missing name: key"; rc=1; }
            grep -q '^tools:' "$f" || { echo "::error file=$f::missing tools: key"; rc=1; }
          done
          exit $rc

      # Counts written into prose drift the moment someone adds a skill or an
      # assertion, and a stale number in a README is the kind of small wrongness
      # that costs a reader's trust in everything around it. Derive both numbers
      # from reality and compare.
      - name: Documented counts match reality
        run: |
          rc=0

          # The assertion count changes whenever a test is added, so the docs
          # deliberately do not state it. Keep it that way: any number or number
          # word in front of "assertion" is a count that will go stale.
          if git grep -nIiE "\b([0-9]+|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty[a-z-]*|thirty[a-z-]*|forty[a-z-]*)[- ]assertions?\b" -- '*.md' ; then
            echo "::error::a document hardcodes the assertion count; describe the suite instead"
            rc=1
          fi

          # The docs nominate this count as the reader's positive control, so a
          # stale value here is worse than an ordinary typo - it teaches people
          # to expect the wrong evidence.
          actual_files=$(bash .claude/scripts/vault-check.sh | sed -n 's/.*across \([0-9]*\) file(s).*/\1/p')
          echo "vault-check scans $actual_files files on a clean checkout"
          if git grep -nIE "across [0-9]+ file" -- '*.md' \
               | grep -vE "across ${actual_files} file" \
               | grep -v 'across 0 file' ; then
            echo "::error::a document states a scanned-file count other than ${actual_files}"
            rc=1
          fi

          actual_skills=$(git ls-files '.claude/skills/*/SKILL.md' | wc -l | tr -d ' ')
          echo ".claude/skills/ contains $actual_skills skills"
          words="zero one two three four five six seven eight nine ten"
          expected_word=$(echo "$words" | cut -d' ' -f$((actual_skills + 1)))
          if git grep -nIiE "\b([0-9]+|two|three|four|five|six|seven|eight|nine|ten) skills" -- '*.md' \
               | grep -viE "\b(${expected_word}|${actual_skills}) skills" ; then
            echo "::error::a document states a skill count other than ${expected_word} (${actual_skills})"
            rc=1
          fi

          exit $rc

      # The manifest is generated from .claude/manifest-rules and the tracked
      # tree, so it goes stale the moment somebody edits a shipped file and does
      # not regenerate. That is the failure that actually happens, and a stale
      # manifest downstream means a vault is told that files it never touched
      # have moved.
      #
      # Guarded by repository, and the guard is the point rather than tidiness.
      # "Use this template" copies this whole workflow into the user's own
      # repository, where the manifest and the tree diverge on their very first
      # note and this step would go red for ever on a vault that is working
      # perfectly. On a pull request from a fork, github.repository is still the
      # base repository, so a contributor's change is checked here as it should
      # be.
      #
      # It does not check that the CLASSIFICATION is right. Both sides run the
      # same rules, so a wrong rule stays self-consistent and this stays green.
      # The hand-written table in run-tests.sh, registered as tmpl-class-table,
      # is the control that can fail on that.
      # VAULT_TEMPLATE_MAINTAINER is set for the same reason --generate needs
      # it. Verification rebuilds the manifest from the whole tracked tree, so
      # in somebody's vault it would read and name their own notes and then
      # print the command that rewrites their provenance record. This job runs
      # in the template repository, which is exactly where that is the right
      # thing to do.
      - name: The template manifest matches the tree
        if: github.repository == 'topazyo/claude-memory-vault'
        env:
          VAULT_TEMPLATE_MAINTAINER: '1'
        run: bash .claude/scripts/vault-update.sh --verify-manifest

      # This repo is a framework. A pull request should never carry someone's
      # real notes, an absolute path containing a username, or a secret.
      - name: No personal content or absolute user paths
        run: |
          rc=0
          # Scan every file. The one deliberate example path, "C:/Users/Some One/",
          # is filtered by name rather than by excluding whole directories, so a
          # real path added to docs/ or a script is still caught.
          if git grep -nIE '[A-Za-z]:[\\/]Users[\\/][A-Za-z0-9._-]+' | grep -vE 'Users[\\/]Some One'; then
            echo "::error::absolute user path committed"
            rc=1
          fi
          # Quotes optional: in a markdown note a pasted secret is usually bare.
          # Plus the prefixes of common real credentials, which need no key name.
          if git grep -nIE '(api[_-]?key|secret|password|passwd|token)[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9/+_-]{20,}|gh[pousr]_[A-Za-z0-9]{36}|sk-ant-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----' ; then
            echo "::error::possible secret committed"
            rc=1
          fi
          exit $rc
