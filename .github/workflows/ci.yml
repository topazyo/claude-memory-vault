name: checks

# The vault ships two checkers and a control suite. Running them here is what
# keeps the portability claims in the README honest: the hooks are bash and are
# advertised as working on Linux, macOS and Git Bash on Windows, so all three
# are exercised on every push rather than trusted.
#
# The macOS job matters most. macOS ships BSD userland (no `grep -P`) and bash
# 3.2 from 2007 as /bin/bash, and neither `jq` nor GNU coreutils are present by
# default. Those differences are invisible on a Linux developer machine, and
# every portability defect this repo has had so far failed in the quiet
# direction - reporting "clean" while scanning nothing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A hung step must fail the build in minutes, not hold a runner for the
    # six-hour GitHub default. The suite takes a minute on Linux and macOS and
    # several on Windows, where process start-up is slow. Windows was already
    # using 18.5 of 30 minutes before the retention controls, and those build
    # roughly fifteen more git repositories, so the limit was 45 to leave the
    # margin a hung step still needs to be caught in.
    #
    # 60 rather than 45, for one unexplained overrun rather than for a cost
    # anybody has measured. The reasoning is written out because the first
    # attempt at it was wrong and a later reader should not repeat it.
    #
    # One Windows run was cancelled against the 45 limit after 55 minutes. The
    # commit it ran on had just added a control that blinds ps so a stop is
    # recorded as unknown, and on Git Bash that sends the stop down a PowerShell
    # fallback this repository records as sometimes taking over a minute, so the
    # control looked like the cause. It is not. The next run carried that
    # control and a second pair doing the same thing, and Windows finished in
    # 33m01s, against 33m04s on the commit before any of them existed. Linux was
    # 5m27s and 5m04s across the same two, which is no change either. So the
    # controls cost almost nothing on any platform and the 55 minute run remains
    # unexplained, most likely a slow runner.
    #
    # 60 covered that observed outlier and still caught a genuinely hung step in
    # an hour rather than the six hour default. Nothing measured then came close.
    #
    # 120 since 1.4.2, measured: 1.4.1's Windows job took 54 minutes. 1.4.2's
    # controls run the dream and promotion runners through dozens more passes,
    # and its Windows jobs took 50 to 68 minutes across the release's commits,
    # rising as controls were added, while one was cancelled at a 60 limit with
    # 967 controls passed, none failed, in the template-update section near the
    # end. Linux took about 10 minutes and macOS 12 to 17 on the same commits, so
    # 120 still catches a hung step in two hours rather than six, and on Windows
    # leaves about fifty minutes over the slowest finished run.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Report the environment
        shell: bash
        run: |
          echo "bash:  $BASH_VERSION"
          echo "uname: $(uname -s)"
          # The locale is reported because a range in a shell pattern is read in
          # the collating order of whichever one the job happens to have, and two
          # defects of exactly that shape reached main without anyone being able
          # to see which locale had produced them.
          echo "locale:"
          locale 2>&1 | sed 's/^/  /' || echo "  locale: MISSING"
          echo "awk version:"
          awk --version 2>&1 | head -n 1 | sed 's/^/  /' || awk -W version 2>&1 | head -n 1 | sed 's/^/  /' || echo "  unknown"
          for t in jq perl awk sed find date; do
            printf '%-6s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done
          # The Pi extension controls need node 18 or later and are required on
          # every job, so this job's node is on record here. The suite's own
          # dependency report records it for every job, the bash 3.2 one too.
          echo "node:  $(node --version 2>/dev/null || echo MISSING)"

      # jq is deliberately NOT installed. It is absent by default on macOS and in
      # Git for Windows, and the hook is written to degrade loudly without it.
      # Installing it here would hide exactly the case most users will hit.

      # strace is installed, and only on this one job. The process-budget
      # control counts the processes a lint call starts and skips without it,
      # so leaving it out meant the single control that proves the hook-cost
      # change did anything never ran on any job, silently. That is the
      # opposite case to jq above: jq absent is a user's real configuration and
      # worth testing, strace absent only blinds the suite.
      - name: Install strace for the process budget
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace

      # No locale is generated for the collating control, and the reason is
      # worth writing down because generating one looks like the obvious fix
      # and was tried here. bash 5 sets globasciiranges by default, which holds
      # range expressions to ASCII whatever the locale says, so on this image
      # the range the control asks about cannot be moved by any locale. The
      # locale really was generated in run 35491897527 and the control skipped
      # anyway. Only the two macOS jobs can ask the question, because macOS
      # ships bash 3.2 as /bin/bash and that predates the option, which is why
      # they are the only jobs that require the control.

      # A platform-gated control that skipped proves nothing on that platform,
      # so each job names the controls that must have run on its system. The
      # suite fails a named control that printed SKIP or never ran.
      - name: Control suite
        shell: bash
        env:
          # The ids this platform must run are in required-controls.txt beside
          # this file, one per line with its platforms, and so are the reasons
          # some of them skip a platform.
          REQUIRED_ON: ${{ matrix.os }}
          # The same comparison the guarded steps make, so one answer decides
          # both. It holds the repository's id, not its name, so a rename keeps
          # it, and a copy made from the template or a fork has an id of its own
          # (the hygiene job checks the id against the name).
          TEMPLATE_REPO: ${{ github.repository_id == '1368450026' }}
        # The required lists belong to this repository. In a vault made from the
        # template, run-tests.sh is owned and moves with each update while this
        # workflow is excluded and never does, so a list frozen here would fail
        # the suite for every id a later template retires or re-gates. The suite
        # itself still runs there; only the insistence on these ids is dropped,
        # with a notice. Here an empty list fails, and the count is printed, so
        # the branch taken is never silent, and a malformed list file fails
        # rather than being read in part.
        run: |
          if [ "$TEMPLATE_REPO" = true ]; then
            RUN_TESTS_REQUIRED="$(awk -v want="${REQUIRED_ON%-latest}" -f .github/workflows/required-controls.awk .github/workflows/required-controls.txt)" \
              || { echo "::error title=The required controls could not be read::required-controls.awk refused required-controls.txt for ${REQUIRED_ON}; the line above says why."; exit 1; }
            export RUN_TESTS_REQUIRED
            [ -n "${RUN_TESTS_REQUIRED:-}" ] || { echo "::error title=No required controls::RUN_TESTS_REQUIRED is empty in the template repository, so no control would be held to running."; exit 1; }
            set -- $RUN_TESTS_REQUIRED
            echo "requiring $# control id(s) to run on this platform"
            # The suite's template-only controls run only with this set (1.7.1).
            # A vault made from the template never takes this branch.
            export VAULT_TEMPLATE_MAINTAINER=1
          else
            unset RUN_TESTS_REQUIRED
            echo "::notice title=Required controls dropped::not the template repository, so the ids frozen in required-controls.txt are not enforced"
          fi
          bash .claude/scripts/run-tests.sh

      # vault-check.sh exits 2 when it scans zero notes, so a path-resolution
      # regression fails this step on its own and no separate vacuity check is
      # needed. The 2 rather than a 1 is the point of the code, since it says
      # the checker could not run rather than that a note in this repository is
      # wrong, and those two would want different things done about them.
      # The warnings change neither the count nor the exit code, so the shipped
      # tree is held to printing none here: a template note a vault copies must
      # not teach the shape the checker warns about.
      - name: Frontmatter invariants
        shell: bash
        run: |
          rc=0
          out="$(bash .claude/scripts/vault-check.sh)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || exit "$rc"
          if printf '%s\n' "$out" | grep -q '^vault-check: WARNING'; then
            echo "::error title=The shipped tree draws a warning::vault-check printed a WARNING line for a note this template ships."
            exit 1
          fi

  bash32:
    name: macOS with system bash 3.2
    runs-on: macos-latest
    # 30 since 1.4.2: this job took 14 to 16 minutes on the release's commits,
    # which left little of the 20 it had.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # macOS ships bash 3.2.57 as /bin/bash because Apple would not ship GPLv3,
      # and `#!/usr/bin/env bash` picks it up unless the user installed a newer
      # one. Invoking /bin/bash explicitly pins the oldest interpreter the
      # scripts claim to support, so a bash-4-only construct fails here rather
      # than in a stranger's terminal.
      - name: Confirm this really is bash 3.2
        run: /bin/bash -c 'echo "$BASH_VERSION"'

      - name: Control suite under bash 3.2
        env:
          # It requires the macos ids of required-controls.txt: it runs on the
          # macos-latest image, so the two macOS jobs hold one list. No strace
          # on macOS, so the process budget is not on it. The bash 3.2 reading
          # of those controls is the whole reason this job exists.
          TEMPLATE_REPO: ${{ github.repository_id == '1368450026' }}
        # Dropped outside this repository, and held non-empty here, for the
        # reasons the Control suite step above gives.
        run: |
          if [ "$TEMPLATE_REPO" = true ]; then
            RUN_TESTS_REQUIRED="$(awk -v want=macos -f .github/workflows/required-controls.awk .github/workflows/required-controls.txt)" \
              || { echo "::error title=The required controls could not be read::required-controls.awk refused required-controls.txt for macos; the line above says why."; exit 1; }
            export RUN_TESTS_REQUIRED
            [ -n "${RUN_TESTS_REQUIRED:-}" ] || { echo "::error title=No required controls::RUN_TESTS_REQUIRED is empty in the template repository, so no control would be held to running."; exit 1; }
            set -- $RUN_TESTS_REQUIRED
            echo "requiring $# control id(s) to run on this platform"
            # As in the step above (1.7.1).
            export VAULT_TEMPLATE_MAINTAINER=1
          else
            unset RUN_TESTS_REQUIRED
            echo "::notice title=Required controls dropped::not the template repository, so the ids frozen in required-controls.txt are not enforced"
          fi
          /bin/bash .claude/scripts/run-tests.sh

      - name: Frontmatter invariants under bash 3.2
        run: |
          rc=0
          out="$(/bin/bash .claude/scripts/vault-check.sh)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || exit "$rc"
          if printf '%s\n' "$out" | grep -q '^vault-check: WARNING'; then
            echo "::error title=The shipped tree draws a warning::vault-check printed a WARNING line under bash 3.2 for a note this template ships."
            exit 1
          fi

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth 0, for the release check at the end of this job and the two
      # steps below that read the tags and the commit a change lands on, and
      # for nothing else. The default shallow checkout carries no tags, and a
      # checkout with no tags looks exactly like a project that has never
      # released one, so the check would report "could not determine" on every
      # run and a reader would learn to expect that from a healthy repository.
      # persist-credentials false because nothing in this job needs network
      # git. Every step here is local, and the default leaves this job's token
      # in .git/config as an http extraheader, inside the very directory the
      # release check writes scratch files into. It
      # costs nothing to take it out, and it matters more now that fetch-depth
      # is 0, which materialises the whole history and every tag on a runner
      # that also executes shell a fork's pull request supplied.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The steps that belong to this repository alone are guarded by its id,
      # github.repository_id, because the id survives a rename and a guard by
      # name went false after one, silently skipping every guarded step. An id
      # typed wrong would skip them just as silently, so this step, guarded by
      # nothing, checks every copy: each guard is a copy of its own. Wherever
      # the name or the id says this is the template repository (a rename
      # keeps the id), every line of this file that names the id, in any case,
      # outside a comment, must be an if: or an env value holding exactly
      # github.repository_id == '<digits>', and every such id must be this
      # repository's. That one shape leaves no room for a guard that negates
      # the comparison or adds a condition of its own, or that spells the
      # property in other letters, which Actions would read the same. And no
      # line but BY_NAME below compares github.repository, the guard by name
      # this file gave up. Other guards (github.event.repository.id, a test in
      # a run: script) are not looked for, and nothing checks how a step uses
      # an env value such as TEMPLATE_REPO. If every copy of the id and the
      # name went wrong at once, this step would not know the repository. The
      # id with any other name says the repository was renamed.
      - name: The repository guard holds this repository's id
        env:
          BY_ID: ${{ github.repository_id == '1368450026' }}
          BY_NAME: ${{ github.repository == 'topazyo/claude-memory-vault' }}
        run: |
          echo "repository $GITHUB_REPOSITORY, id ${GITHUB_REPOSITORY_ID:-unknown}: guarded steps run: $BY_ID"
          if [ "$BY_NAME" = true ] || [ "$BY_ID" = true ]; then
            # Words are split here so that this step's own lines are not among
            # the matches. A shell's $GITHUB_REPOSITORY_ID or ${...} is taken
            # out first, since a match that ignores case would find it; any
            # other spelling of it stays and is judged by its shape.
            q='repository''_id'
            grep -n '' .github/workflows/ci.yml | grep -vE '^[0-9]+:[[:space:]]*#' > "$RUNNER_TEMP/ci.code"
            sed -E 's/\$\{?GITHUB_REPOSITORY''_ID//g' "$RUNNER_TEMP/ci.code" | grep -i -- "$q" > "$RUNNER_TEMP/id.lines" || true
            cut -d: -f1 "$RUNNER_TEMP/id.lines" > "$RUNNER_TEMP/id.nums"
            # The comparison alone: the if: or env key, then a ${{ }} around it, taken off.
            cut -d: -f2- "$RUNNER_TEMP/id.lines" \
              | sed -E 's/^[[:space:]]*(if|[A-Z_]+):[[:space:]]+//; s/^\$\{\{ (.*) \}\}[[:space:]]*$/\1/; s/[[:space:]]+$//' > "$RUNNER_TEMP/id.bodies"
            all=$(wc -l < "$RUNNER_TEMP/id.lines")
            bad=$(grep -cEv "^github\.$q == '[0-9]+'\$" "$RUNNER_TEMP/id.bodies" || true)
            sed "s/^.*== '//; s/'\$//" "$RUNNER_TEMP/id.bodies" | sort | uniq -c > "$RUNNER_TEMP/ids"
            echo "ci.yml names the id on $all line(s), $bad of another shape; ids: $(awk '{ printf "%s x%s ", $2, $1 }' "$RUNNER_TEMP/ids")"
            if [ "$bad" -ne 0 ]; then
              paste -d: "$RUNNER_TEMP/id.nums" "$RUNNER_TEMP/id.bodies" | grep -Ev "^[0-9]+:github\.$q == '[0-9]+'\$" | sed 's/^/  another shape at ci.yml line /'
            fi
            r='github\.repository''[[:space:]]*=='
            grep -Ei -- "$r" "$RUNNER_TEMP/ci.code" | grep -vE '^[0-9]+:[[:space:]]*BY_NAME: ' > "$RUNNER_TEMP/by.name" || true
            if [ -s "$RUNNER_TEMP/by.name" ]; then
              sed 's/^/  a guard by name at ci.yml line /' "$RUNNER_TEMP/by.name"
            fi
            if [ "$all" -eq 0 ] || [ "$bad" -ne 0 ] || [ "$(wc -l < "$RUNNER_TEMP/ids")" -ne 1 ] \
              || [ "$(awk '{ print $2 }' "$RUNNER_TEMP/ids")" != "${GITHUB_REPOSITORY_ID:-}" ] || [ -s "$RUNNER_TEMP/by.name" ]; then
              echo "::error title=A repository guard is wrong::This is the template repository, id ${GITHUB_REPOSITORY_ID:-unknown}, but not every line of ci.yml that names the id is an if: or env value holding exactly github.$q == '${GITHUB_REPOSITORY_ID:-<id>}', or a step is guarded by name (see above), so a step guarded by a wrong one skips without a word."
              exit 1
            fi
          fi
          if [ "$BY_ID" = true ] && [ "$BY_NAME" != true ]; then
            echo "::notice title=The repository was renamed::The guards still hold, by id. Update the name in this step and in CONTRIBUTING.md."
          fi

      # A published release's CHANGELOG entry stays as it was tagged. Two
      # branches that both wrote the same release heading merged cleanly with
      # one side's text under the other's published heading, and every other
      # check passed, because the version checks read only the newest heading.
      # Each tag's own entry is compared with the same entry here, byte for
      # byte, and a comparison of nothing fails rather than passing. Guarded by
      # repository, as the release step at the end of this job is and for the
      # same reason.
      - name: Published CHANGELOG entries are as they were tagged
        if: github.repository_id == '1368450026'
        run: |
          # Both read headings outside code fences only, so an entry that quotes
          # an older heading in a code block neither opens nor ends one.
          entry() {  # entry <version> - that release's entry, heading to the next release heading
            ENTRY_H="## $1 — " awk 'BEGIN { h = ENVIRON["ENTRY_H"] }
              /^```/ { f = 1 - f; if (on) print; next }
              !f && index($0, h) == 1 { on = 1; print; next }
              on && !f && /^## [0-9]/ { exit }
              on { print }'
          }
          headings() {  # headings <version> - how many lines of standard input, outside code fences, are that release's heading
            ENTRY_H="## $1 — " awk 'BEGIN { h = ENVIRON["ENTRY_H"] } /^```/ { f = 1 - f; next } !f && index($0, h) == 1 { c++ } END { print c + 0 }'
          }
          n=0; bad=0
          for t in $(git tag --list '[0-9]*.[0-9]*.[0-9]*'); do
            case "$t" in *[!0-9.]*) echo "$t: not a release version, so not compared"; continue ;; esac
            git cat-file -e "$t:CHANGELOG.md" 2>/dev/null \
              || { echo "$t: the tag holds no CHANGELOG.md, so there is nothing to compare"; continue; }
            git show "$t:CHANGELOG.md" | entry "$t" > /tmp/cl.tag
            [ -s /tmp/cl.tag ] || { echo "::warning title=A tag's CHANGELOG has no entry for it::$t has a CHANGELOG.md with no $t heading, so there is nothing to compare."; continue; }
            entry "$t" < CHANGELOG.md > /tmp/cl.now
            n=$((n + 1))
            c="$(headings "$t" < CHANGELOG.md)"
            if [ "$c" -eq 0 ]; then
              bad=$((bad + 1))
              echo "::error title=A published CHANGELOG entry is missing::The $t heading is not here, and a published release keeps its entry."
            elif [ "$c" -ne 1 ]; then
              bad=$((bad + 1))
              echo "::error title=A published CHANGELOG heading is not unique::The $t heading is on $c lines here, and a published release has exactly one."
            elif cmp -s /tmp/cl.tag /tmp/cl.now; then
              echo "$t: the entry is as it was tagged"
            else
              bad=$((bad + 1))
              echo "::error title=A published CHANGELOG entry changed::The $t entry differs from the one tagged $t. Put new text under a new release heading."
              diff /tmp/cl.tag /tmp/cl.now | head -n 40 || true
            fi
          done
          echo "compared $n published entries, $bad changed"
          [ "$n" -gt 0 ] || { echo "::error title=No published entry was compared::No tag named a release with an entry of its own, so this said nothing. A checkout with no tags looks like this."; exit 1; }
          [ "$bad" -eq 0 ]

      # Every control main requires to run must still be required here, on the
      # same platform. RUN_TESTS_REQUIRED fails a listed control that did not
      # run and says nothing about one missing from the list, so resolving a
      # conflict on the long lines these ids once sat on by taking one side
      # dropped the other side's ids with no signal at all. RETIRED names,
      # space-separated, an id this change stops requiring on purpose, so the
      # diff says so.
      #
      # The ids are in required-controls.txt since Release C. A base from
      # before that holds them in four RUN_TESTS_REQUIRED lines of ci.yml
      # instead, so a base with no such file is read the old way, and a base
      # with one is read with its own required-controls.awk, so a change to the
      # reader cannot hide an id on both sides at once. This side must have
      # the file.
      #
      # The side compared against is what this change lands on: on a pull
      # request the checkout is the merge commit, whose first parent is the
      # branch it merges into, as it was when the run began, so a re-run and a
      # pull request based on another one are each held to their own base. On
      # a push to main it is the main the push replaced, however many commits
      # the push carries, and the parent commit when that one is not here.
      - name: Required controls are not dropped against main
        if: github.repository_id == '1368450026'
        env:
          RETIRED: ''
          BEFORE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            push)
              base="$BEFORE"
              git cat-file -e "$base^{commit}" 2>/dev/null || base=HEAD^1 ;;
            *) base=origin/main ;;
          esac
          echo "comparing with $base ($(git rev-parse --short "$base" 2>/dev/null || echo unknown)${GITHUB_BASE_REF:+, $GITHUB_BASE_REF})"
          git show "$base:.github/workflows/ci.yml" > /tmp/ci.base.yml \
            || { echo "::error title=No base to compare::ci.yml could not be read at $base."; exit 1; }
          [ -s .github/workflows/required-controls.txt ] \
            || { echo "::error title=No list of required controls::.github/workflows/required-controls.txt is missing or empty here, so no id is required anywhere."; exit 1; }
          if git cat-file -e "$base:.github/workflows/required-controls.txt" 2>/dev/null; then
            { git show "$base:.github/workflows/required-controls.txt" > /tmp/req.base \
                && git show "$base:.github/workflows/required-controls.awk" > /tmp/req.base.awk; } \
              || { echo "::error title=No base to compare::required-controls.txt or its reader could not be read at $base."; exit 1; }
          else
            : > /tmp/req.base
          fi
          # arms <ci.yml> <required-controls.txt> <reader> - one line per list:
          # its position (list1 windows-latest, list2 ubuntu-latest, list3
          # macos-latest, list4 bash 3.2), then its ids. An empty list file
          # means the base predates it, so ci.yml's own lines are read. The
          # base's reader is called as this side calls it, so -v want=lists and
          # that output are an interface: a change to them lands in two steps,
          # a reader that still answers the old call first.
          arms() {
            if [ -s "$2" ]; then
              awk -v want=lists -f "$3" "$2"
            else
              awk '/^[ \t]*RUN_TESTS_REQUIRED:/ {
                if (index($0, "matrix.os")) {
                  n = split($0, q, "\047")
                  for (i = 2; i <= n; i += 2) if (q[i] != "windows-latest" && q[i] != "ubuntu-latest") print "list" (++k), q[i]
                } else { sub(/^[^:]*RUN_TESTS_REQUIRED:[ \t]*/, ""); print "list" (++k), $0 }
              }' "$1"
            fi
          }
          arms /tmp/ci.base.yml /tmp/req.base /tmp/req.base.awk > /tmp/arms.base \
            || { echo "::error title=The lists could not be read::required-controls.txt at $base was refused; the line above says why."; exit 1; }
          arms .github/workflows/ci.yml .github/workflows/required-controls.txt .github/workflows/required-controls.awk > /tmp/arms.head \
            || { echo "::error title=The lists could not be read::required-controls.txt was refused; the line above says why."; exit 1; }
          [ "$(wc -l < /tmp/arms.base)" -eq 4 ] && [ "$(wc -l < /tmp/arms.head)" -eq 4 ] \
            || { echo "::error title=The lists could not be read::Expected four lists on each side, found $(wc -l < /tmp/arms.base) at $base and $(wc -l < /tmp/arms.head) here."; exit 1; }
          # The jobs ask the reader for one platform's ids, not for the lists,
          # so each of those answers must be its list's ids here, or a reader
          # that answered the two calls differently would drop ids unseen. The
          # bash 3.2 job asks for macos, so list4 is held to that answer too.
          # This runs under this job's awk and environment, not each job's, so
          # a reader that depends on either is for review to catch.
          for p in windows:list1 ubuntu:list2 macos:list3 macos:list4; do
            got=$(awk -v want="${p%%:*}" -f .github/workflows/required-controls.awk .github/workflows/required-controls.txt) \
              || { echo "::error title=The lists could not be read::required-controls.txt was refused for ${p%%:*}."; exit 1; }
            line=$(awk -v a="${p#*:}" '$1 == a { $1 = ""; sub(/^ /, ""); print }' /tmp/arms.head)
            [ "$got" = "$line" ] \
              || { echo "::error title=The reader answers a job differently::The ids it gives ${p%%:*} are not the ids of ${p#*:}, which this step compares."; exit 1; }
          done
          total=0; lost=0
          while read -r arm ids; do
            here=" $(awk -v a="$arm" '$1 == a { $1 = ""; print }' /tmp/arms.head) "
            for id in $ids; do
              total=$((total + 1))
              case "$here" in *" $id "*) continue ;; esac
              case " $RETIRED " in *" $id "*) echo "$arm: $id retired on purpose"; continue ;; esac
              lost=$((lost + 1))
              echo "::error title=A required control was dropped::$id is required by $base in $arm and is missing here. Put it back, or name it in RETIRED if the change retires it."
            done
          done < /tmp/arms.base
          echo "checked $total id(s) $base requires across 4 lists, $lost missing"
          [ "$total" -gt 0 ] || { echo "::error title=Nothing was compared::$base requires no id at all, which this repository never does."; exit 1; }
          [ "$lost" -eq 0 ]

      # RUN_TESTS_REQUIRED fails a listed control that did not run, so a control
      # on no list at all runs, or skips, with no signal anywhere: every id the
      # suite records with ran must be on at least one list, or be named in
      # NOT_REQUIRED. Those were recorded and required by no job when this step
      # was added (1.4.1), and each predates it. A ran call must name its id
      # literally, or this step could not see it; the one exception is the line
      # that relays the Pi driver's own "ran <id>" lines, whose ids are read
      # from its say("ran <id>") calls instead. The bash 3.2 job and the
      # macos-latest job run on the same image, so both read the macos ids of
      # required-controls.txt, and neither can drift from the other.
      #
      # Guarded by repository. In a vault made from this template, run-tests.sh
      # is owned and moves with every update while this workflow is excluded
      # and never does, so the first update that adds a control would turn
      # this step red for ever on a vault that is working perfectly.
      - name: Every recorded control is required somewhere
        if: github.repository_id == '1368450026'
        env:
          NOT_REQUIRED: >-
            runlog-hardlink runlog-mode runlog-unreadable stopping win-survivor win-late win-reaped
            win-kill-check retention-symlink-candidate stub-unknown-timestamp kill-state-gate
            putback-kill-state-gate c1-name-log
        run: |
          awk '/^[ \t]*#/ { next }
            { s = $0
              while (match(s, /(^[ \t]*|[;&|(){][ \t]*|(then|else|do)[ \t]+)ran[ \t]+[^ \t;)|&]+/)) {
                a = substr(s, RSTART, RLENGTH); sub(/^.*ran[ \t]+/, "", a); gsub(/"/, "", a)
                if (a ~ /^[a-z0-9][a-z0-9-]*$/) print a; else if (a != "${pi_line#ran" && a != "${omp_line#ran") print "?" FNR ": " a
                s = substr(s, RSTART + RLENGTH) }
              s = $0
              while (match(s, /say\("ran [a-z0-9][a-z0-9-]*"\)/)) {
                a = substr(s, RSTART + 9, RLENGTH - 11); print a
                s = substr(s, RSTART + RLENGTH) } }' .claude/scripts/run-tests.sh | sort -u > /tmp/ran.ids
          awk -v want=lists -f .github/workflows/required-controls.awk .github/workflows/required-controls.txt > /tmp/lists \
            || { echo "::error title=The lists could not be read::required-controls.txt was refused; the line above says why."; exit 1; }
          [ "$(wc -l < /tmp/lists)" -eq 4 ] \
            || { echo "::error title=The lists could not be read::Expected four lists, found $(wc -l < /tmp/lists)."; exit 1; }
          awk '{ for (i = 2; i <= NF; i++) print $i }' /tmp/lists | sort -u > /tmp/req.ids
          bad=0
          while read -r id; do
            case "$id" in
              \?*) bad=$((bad + 1)); echo "::error title=A control id this step cannot read::run-tests.sh line ${id#?} calls ran with an argument that is not a literal id." ; continue ;;
            esac
            grep -qx -- "$id" /tmp/req.ids && continue
            case " $NOT_REQUIRED " in *" $id "*) continue ;; esac
            bad=$((bad + 1))
            echo "::error title=A recorded control is required nowhere::$id is recorded with ran but is on no line of required-controls.txt. Require it where it runs, or name it in NOT_REQUIRED with the reason."
          done < /tmp/ran.ids
          for id in $NOT_REQUIRED; do
            grep -qx -- "$id" /tmp/ran.ids || { bad=$((bad + 1)); echo "::error title=NOT_REQUIRED names an id the suite no longer records::$id"; }
            grep -qx -- "$id" /tmp/req.ids && { bad=$((bad + 1)); echo "::error title=NOT_REQUIRED names a required id::$id is on a list now, so take it out of NOT_REQUIRED."; }
          done
          echo "checked $(wc -l < /tmp/ran.ids) recorded id(s) against $(wc -l < /tmp/req.ids) required; $bad problem(s)"
          [ "$(wc -l < /tmp/ran.ids)" -gt 0 ] || { echo "::error title=Nothing was checked::run-tests.sh records no control with ran, which this repository never does."; exit 1; }
          # Ids recorded by a ran at a line's start, after ||, after then,
          # and by the Pi relay's say("ran ID"): a reading that misses any of
          # those forms fails here. Each pair is an id and the form it pins.
          for pair in 'mem-override-flag:a ran at the start of a line' 'mem-override-path-refused:a ran after ||' \
                      'mem-override-utf8-lax-host:a ran after then' 'pi-extension-behaviour:say("ran ID")'; do
            id="${pair%%:*}"
            grep -qx -- "$id" /tmp/ran.ids || { echo "::error title=The ids were misread::$id was not found among the ids read from run-tests.sh. Either the reading above is broken, or that control was renamed, removed, or no longer records its id as ${pair#*:}, the form it was chosen to pin; then pick another id recorded that way."; exit 1; }
          done
          [ "$bad" -eq 0 ]

      # The steps below that check every tracked file of a kind list them with
      # tracked.sh beside this file: NUL-separated, read on descriptor 3, and a
      # list that matches nothing fails here and is a notice in a vault. Its
      # header says why.
      - name: Every shell script parses
        env:
          TEMPLATE_REPO: ${{ github.repository_id == '1368450026' }}
        run: |
          rc=0
          . .github/workflows/tracked.sh
          # Git hooks have no .sh extension, so they are listed separately.
          tracked '*.sh' '.claude/githooks/*'
          while IFS= read -r -d '' -u 3 f; do
            bash -n "$f" || { echo "::error file=$f::syntax error"; rc=1; }
          done 3< "$RUNNER_TEMP/files"
          exit $rc

      # Advisory, not gating. Several warnings here would be deliberate - the
      # word splitting in `for d in $TIERS` is intended, for instance - and a
      # build that fails on a style opinion trains people to ignore the build.
      # Read the output, silence what is genuinely intentional with a
      # `# shellcheck disable=` comment and a reason, then make this gating.
      #
      # run-tests.sh is skipped, and says so. shellcheck 0.9.0 needs more than
      # 13 GB to check it: on 2026-09-30 it exhausted 13 GB on 1.4.0's copy,
      # while a 421-line piece of it took 80 MB, which points to the file's
      # size and not one construct. On this runner 1.4.0's copy fitted, and
      # 1.4.1's added tests pushed it over, so the runner ran out of memory and
      # was stopped, and every step after this one never ran. continue-on-error
      # cannot catch that.
      - name: shellcheck (advisory)
        continue-on-error: true
        env:
          TEMPLATE_REPO: ${{ github.repository_id == '1368450026' }}
        run: |
          shellcheck --version
          . .github/workflows/tracked.sh
          tracked '*.sh' '.claude/githooks/*'
          while IFS= read -r -d '' -u 3 f; do
            if [ "$f" = .claude/scripts/run-tests.sh ]; then
              echo "--- $f: skipped, too large for shellcheck on this runner (see the comment in ci.yml)"
              continue
            fi
            echo "--- $f"
            shellcheck --severity=warning "$f" || true
          done 3< "$RUNNER_TEMP/files"

      - name: Every JSON file parses
        env:
          TEMPLATE_REPO: ${{ github.repository_id == '1368450026' }}
        run: |
          rc=0
          . .github/workflows/tracked.sh
          tracked '*.json'
          while IFS= read -r -d '' -u 3 f; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              || { echo "::error file=$f::invalid JSON"; rc=1; }
          done 3< "$RUNNER_TEMP/files"
          exit $rc

      # OpenCode runs every file in .opencode/plugins/ at startup without a trust
      # prompt, and the singular .opencode/plugin/ and the custom tools in
      # .opencode/tools/ and .opencode/tool/ as well, from an .opencode folder at
      # any depth it walks through, so the template must never ship one there:
      # anyone opening a clone would run it. The plugin lives in .claude/adapters/
      # and a user copies it in deliberately (docs/harnesses/opencode.md). The
      # pathspecs match in any letter case, and the step first runs them in a
      # scratch repository whose answer is known, as the .pi step below does.
      # Guarded to this repository, as the .pi step is and for the same reason:
      # docs/harnesses/opencode.md has a vault's owner copy the plugin into
      # .opencode/plugins/, and committing it there is the guide working.
      - name: The OpenCode plugin ships opt-in
        if: github.repository_id == '1368450026'
        run: |
          specs=()
          for d in plugin plugins tool tools; do
            specs+=(":(icase,glob).opencode/$d/**" ":(icase,glob)**/.opencode/$d/**")
          done
          scratch="${RUNNER_TEMP:?}/opencode-pathspec-probe"
          rm -rf "$scratch"
          # Each path has its own parent folder, so a file system that ignores
          # case (macOS) cannot fold two of them into one.
          mkdir -p "$scratch/.OpenCode/Plugins" "$scratch/a/.opencode/plugin" "$scratch/d/.opencode/tools" "$scratch/b/.opencode/TOOL" \
            "$scratch/e/.opencode/agent" "$scratch/c/opencode/plugins" "$scratch/.opencodex/plugins"
          for f in .OpenCode/Plugins/x.ts a/.opencode/plugin/x.js d/.opencode/tools/x.ts b/.opencode/TOOL/x.js \
                   e/.opencode/agent/x.md c/opencode/plugins/x.ts .opencodex/plugins/x.ts e/.opencode/opencode.json; do
            printf 'x\n' > "$scratch/$f"
          done
          { git -C "$scratch" init -q && git -C "$scratch" add -A; } || { echo "::error::could not build the pathspec probe repository"; exit 1; }
          probe=$(git -C "$scratch" ls-files -- "${specs[@]}") || { echo "::error::git ls-files failed"; exit 1; }
          want=$(printf '%s\n' .OpenCode/Plugins/x.ts a/.opencode/plugin/x.js d/.opencode/tools/x.ts b/.opencode/TOOL/x.js | sort)
          if [ "$(printf '%s\n' "$probe" | sort)" != "$want" ]; then
            echo "::error::in a probe repository the .opencode plugin and tool pathspecs listed [$(printf '%s' "$probe" | tr '\n' ' ')], not the four plugin and tool files among the decoys, so an answer below could not be trusted"
            exit 1
          fi
          found=$(git ls-files -- "${specs[@]}") || { echo "::error::git ls-files failed"; exit 1; }
          if [ -n "$found" ]; then
            echo "::error::an OpenCode plugin or tool is tracked ($(printf '%s' "$found" | tr '\n' ' ')); the template must ship the OpenCode plugin opt-in"
            exit 1
          fi

      # Pi runs .pi/extensions/, installs the packages .pi/settings.json names
      # and replaces its system prompt from .pi/SYSTEM.md once a project is
      # trusted, and trust saved for a folder covers every folder below it. So
      # the template ships nothing under .pi/, and its extension lives in
      # .claude/adapters/pi/ for a user to load deliberately (docs/harnesses/pi.md).
      # Guarded to this repository, because a vault made from the template may
      # commit its own reviewed copy there, as the guide allows. The pathspecs
      # match a .pi at any depth, as a folder or as a file or link, because Pi
      # loads .pi/ from whichever folder it is started in, and icase catches
      # .PI, which Windows and macOS open as .pi. A pathspec that matches nothing
      # looks just like one git could not read or one with a typo, so the step
      # first runs the same pathspecs in a scratch repository whose answer is
      # known: its three .pi paths, in mixed case, and none of its decoys.
      - name: The Pi extension ships opt-in
        if: github.repository_id == '1368450026'
        run: |
          specs=(':(icase,glob).pi' ':(icase,glob).pi/**' ':(icase,glob)**/.pi' ':(icase,glob)**/.pi/**')
          scratch="${RUNNER_TEMP:?}/pi-pathspec-probe"
          rm -rf "$scratch"
          mkdir -p "$scratch/.PI" "$scratch/a/.Pi/extensions" "$scratch/b" "$scratch/a/pi" "$scratch/.pilot" "$scratch/c"
          for f in .PI/x a/.Pi/extensions/x.js b/.pi a/pi/x.js .pilot/x c/x.pi pi.md; do printf 'x\n' > "$scratch/$f"; done
          { git -C "$scratch" init -q && git -C "$scratch" add -A; } || { echo "::error::could not build the pathspec probe repository"; exit 1; }
          probe=$(git -C "$scratch" ls-files -- "${specs[@]}") || { echo "::error::git ls-files failed"; exit 1; }
          if [ "$(printf '%s\n' "$probe" | sort)" != "$(printf '%s\n' .PI/x a/.Pi/extensions/x.js b/.pi | sort)" ]; then
            echo "::error::in a probe repository holding .PI/x, a/.Pi/extensions/x.js and b/.pi among decoys the .pi pathspecs listed [$(printf '%s' "$probe" | tr '\n' ' ')], so an answer below could not be trusted"
            exit 1
          fi
          found=$(git ls-files -- "${specs[@]}") || { echo "::error::git ls-files failed"; exit 1; }
          if [ -n "$found" ]; then
            echo "::error::a .pi folder or file is tracked ($(printf '%s' "$found" | tr '\n' ' ')); the template must ship nothing under .pi/ (the Pi extension is opt-in)"
            exit 1
          fi

      # Oh My Pi (omp) runs .omp/hooks/ and .omp/extensions/ from the folder it is
      # started in with no project trust gate at all (isProjectTrusted() always
      # returns true in its extension API), so a file shipped there would run on
      # every clone and inside every omp pass. The template ships nothing under
      # .omp/ (CONTRIBUTING.md, "Adding a harness"). The same pathspec shapes and
      # the same probe as the Pi step above, for the same reasons.
      - name: Nothing ships under .omp/
        if: github.repository_id == '1368450026'
        run: |
          specs=(':(icase,glob).omp' ':(icase,glob).omp/**' ':(icase,glob)**/.omp' ':(icase,glob)**/.omp/**')
          scratch="${RUNNER_TEMP:?}/omp-pathspec-probe"
          rm -rf "$scratch"
          mkdir -p "$scratch/.OMP" "$scratch/a/.Omp/extensions" "$scratch/b" "$scratch/a/omp" "$scratch/.ompx" "$scratch/c"
          for f in .OMP/x a/.Omp/extensions/x.js b/.omp a/omp/x.js .ompx/x c/x.omp omp.md; do printf 'x\n' > "$scratch/$f"; done
          { git -C "$scratch" init -q && git -C "$scratch" add -A; } || { echo "::error::could not build the pathspec probe repository"; exit 1; }
          probe=$(git -C "$scratch" ls-files -- "${specs[@]}") || { echo "::error::git ls-files failed"; exit 1; }
          if [ "$(printf '%s\n' "$probe" | sort)" != "$(printf '%s\n' .OMP/x a/.Omp/extensions/x.js b/.omp | sort)" ]; then
            echo "::error::in a probe repository holding .OMP/x, a/.Omp/extensions/x.js and b/.omp among decoys the .omp pathspecs listed [$(printf '%s' "$probe" | tr '\n' ' ')], so an answer below could not be trusted"
            exit 1
          fi
          found=$(git ls-files -- "${specs[@]}") || { echo "::error::git ls-files failed"; exit 1; }
          if [ -n "$found" ]; then
            echo "::error::a .omp folder or file is tracked ($(printf '%s' "$found" | tr '\n' ' ')); the template must ship nothing under .omp/ (omp runs it with no trust gate)"
            exit 1
          fi

      # The shipped harness configs are only useful if their harness can parse
      # them, and a syntax error in each fails silently: the harness skips the
      # file and runs with no hooks at all.
      - name: Harness configs parse (TOML, YAML, plugin JavaScript)
        env:
          TEMPLATE_REPO: ${{ github.repository_id == '1368450026' }}
        run: |
          rc=0
          . .github/workflows/tracked.sh
          tracked '*.toml'
          while IFS= read -r -d '' -u 3 f; do
            python3 -c "import tomllib,sys; tomllib.load(open(sys.argv[1],'rb'))" "$f" \
              || { echo "::error file=$f::invalid TOML"; rc=1; }
          done 3< "$RUNNER_TEMP/files"
          tracked '*.yml' '*.yaml'
          while IFS= read -r -d '' -u 3 f; do
            ruby -ryaml -e 'YAML.load_file(ARGV[0])' "$f" \
              || { echo "::error file=$f::invalid YAML"; rc=1; }
          done 3< "$RUNNER_TEMP/files"
          # The adapters are ES modules, and under .mjs every Node parses them as
          # one. The pathspec's * crosses folders, so it reaches each adapter.
          tracked '.claude/adapters/*.js'
          while IFS= read -r -d '' -u 3 f; do
            cp "$f" "$RUNNER_TEMP/plugin-check.mjs"
            node --check "$RUNNER_TEMP/plugin-check.mjs" \
              || { echo "::error file=$f::invalid JavaScript"; rc=1; }
          done 3< "$RUNNER_TEMP/files"
          exit $rc

      # Windows has no executable bit, so scripts committed from a Windows
      # machine land as 100644 and `./script.sh` fails on a Linux clone.
      - name: Shell scripts are executable in the index
        env:
          TEMPLATE_REPO: ${{ github.repository_id == '1368450026' }}
        run: |
          rc=0
          . .github/workflows/tracked.sh
          # Each entry is "<mode> <object> <stage><TAB><name>", read whole, so
          # the name is never used as a pathspec of its own.
          tracked -s '*.sh' '.claude/githooks/*'
          while IFS= read -r -d '' -u 3 entry; do
            mode=${entry%% *}
            f=${entry#*$'\t'}
            [ "$mode" = "100755" ] || { echo "::error file=$f::mode $mode, expected 100755"; rc=1; }
          done 3< "$RUNNER_TEMP/files"
          exit $rc

      # A skill without a name: key silently never registers, which is the worst
      # kind of breakage - nothing errors, the skill simply does not exist.
      - name: Skills and agents declare their frontmatter keys
        env:
          TEMPLATE_REPO: ${{ github.repository_id == '1368450026' }}
        run: |
          rc=0
          . .github/workflows/tracked.sh
          tracked '.claude/skills/*/SKILL.md'
          while IFS= read -r -d '' -u 3 f; do
            grep -q '^name:' "$f" || { echo "::error file=$f::missing name: key"; rc=1; }
          done 3< "$RUNNER_TEMP/files"
          tracked '.claude/agents/*.md'
          while IFS= read -r -d '' -u 3 f; do
            grep -q '^name:' "$f"  || { echo "::error file=$f::missing name: key"; rc=1; }
            grep -q '^tools:' "$f" || { echo "::error file=$f::missing tools: key"; rc=1; }
          done 3< "$RUNNER_TEMP/files"
          exit $rc

      # Counts written into prose drift the moment someone adds a skill or an
      # assertion, and a stale number in a README is the kind of small wrongness
      # that costs a reader's trust in everything around it. Derive both numbers
      # from reality and compare.
      #
      # Guarded by repository. The counts are this template's: in a vault made
      # from it, the owner's first note changes what vault-check scans while
      # the docs keep the template's number, and the step would go red for ever
      # on a vault that is working perfectly.
      - name: Documented counts match reality
        if: github.repository_id == '1368450026'
        run: |
          rc=0

          # The assertion count changes whenever a test is added, so the docs
          # deliberately do not state it. Keep it that way: any number or number
          # word in front of "assertion" is a count that will go stale.
          if git grep -nIiE "\b([0-9]+|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty[a-z-]*|thirty[a-z-]*|forty[a-z-]*)[- ]assertions?\b" -- '*.md' ; then
            echo "::error::a document hardcodes the assertion count; describe the suite instead"
            rc=1
          fi

          # The docs nominate this count as the reader's positive control, so a
          # stale value here is worse than an ordinary typo - it teaches people
          # to expect the wrong evidence.
          actual_files=$(bash .claude/scripts/vault-check.sh | sed -n 's/.*across \([0-9]*\) file(s).*/\1/p')
          echo "vault-check scans $actual_files files on a clean checkout"
          if git grep -nIE "across [0-9]+ file" -- '*.md' \
               | grep -vE "across ${actual_files} file" \
               | grep -v 'across 0 file' ; then
            echo "::error::a document states a scanned-file count other than ${actual_files}"
            rc=1
          fi

          actual_skills=$(git ls-files '.claude/skills/*/SKILL.md' | wc -l | tr -d ' ')
          echo ".claude/skills/ contains $actual_skills skills"
          words="zero one two three four five six seven eight nine ten"
          expected_word=$(echo "$words" | cut -d' ' -f$((actual_skills + 1)))
          if git grep -nIiE "\b([0-9]+|two|three|four|five|six|seven|eight|nine|ten) skills" -- '*.md' \
               | grep -viE "\b(${expected_word}|${actual_skills}) skills" ; then
            echo "::error::a document states a skill count other than ${expected_word} (${actual_skills})"
            rc=1
          fi

          exit $rc

      # The manifest is generated from .claude/manifest-rules and the tracked
      # tree, so it goes stale the moment somebody edits a shipped file and does
      # not regenerate. That is the failure that actually happens, and a stale
      # manifest downstream means a vault is told that files it never touched
      # have moved.
      #
      # Guarded by repository, and the guard is the point rather than tidiness.
      # "Use this template" copies this whole workflow into the user's own
      # repository, where the manifest and the tree diverge on their very first
      # note and this step would go red for ever on a vault that is working
      # perfectly. On a pull request from a fork, github.repository_id is still
      # the base repository's, so a contributor's change is checked here as it
      # should be.
      #
      # It does not check that the CLASSIFICATION is right. Both sides run the
      # same rules, so a wrong rule stays self-consistent and this stays green.
      # The hand-written table in run-tests.sh, registered as tmpl-class-table,
      # is the control that can fail on that.
      # VAULT_TEMPLATE_MAINTAINER is set for the same reason --generate needs
      # it. Verification rebuilds the manifest from the whole tracked tree, so
      # in somebody's vault it would read and name their own notes and then
      # print the command that rewrites their provenance record. This job runs
      # in the template repository, which is exactly where that is the right
      # thing to do.
      - name: The template manifest matches the tree
        if: github.repository_id == '1368450026'
        env:
          VAULT_TEMPLATE_MAINTAINER: '1'
        run: bash .claude/scripts/vault-update.sh --verify-manifest

      # This repo is a framework. A pull request should never carry someone's
      # real notes, an absolute path containing a username, or a secret.
      #
      # Two steps, the credential scan first, so a hit in the user-path step,
      # which ends the job, cannot hide one here. The converse is the price: a
      # credential hit ends the job before the user-path scan and the release
      # step run, so after fixing it, read the next run for those. The credential
      # scan is not guarded: a secret in a vault's notes is worth a red build
      # there too. It matches by shape, so ordinary prose such as "token: "
      # followed by a long identifier can trip it. Reword the line first; failing
      # that, a vault edits its own copy of this workflow, which the template
      # never updates. It prints where each hit is, never the matching text,
      # because the job log is only as private as the repository and outlives
      # the fix.
      - name: No credentials committed
        run: |
          rc=0
          # Quotes optional: in a markdown note a pasted secret is usually bare.
          # Plus the prefixes of common real credentials, which need no key name.
          # Only file:line is printed, not the line itself: in a vault this step
          # runs unguarded, and a real secret printed into the job log would stay
          # there after the commit is fixed.
          hits="$(git grep -nIE '(api[_-]?key|secret|password|passwd|token)[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9/+_-]{20,}|gh[pousr]_[A-Za-z0-9]{36}|sk-ant-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----' | cut -d: -f1,2)" || :
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::possible secret committed"
            rc=1
          fi
          exit $rc

      # Guarded by repository. In a vault made from the template, notes naming
      # the owner's own folders are the vault working, and this step would go
      # red for ever on them.
      - name: No personal content or absolute user paths
        if: github.repository_id == '1368450026'
        run: |
          rc=0
          # Scan every file. The one deliberate example path, "C:/Users/Some One/",
          # is filtered by name rather than by excluding whole directories, so a
          # real path added to docs/ or a script is still caught.
          if git grep -nIE '[A-Za-z]:[\\/]Users[\\/][A-Za-z0-9._-]+' | grep -vE 'Users[\\/]Some One'; then
            echo "::error::absolute user path committed"
            rc=1
          fi
          exit $rc

      # The release has to advance with the repository, and until this step
      # existed nothing made it. `vault-update.sh` tells a vault what moved by
      # comparing manifests, and `docs/updating.md` tells the reader to hear
      # about a newer copy by watching this repository's releases. A merge that
      # edited a shipped file, left VERSION alone and was never tagged produced
      # a template whose newest content no vault could discover, while the
      # manifest still verified and this workflow still went green.
      #
      # THIS STEP IS NOT PATH FILTERED, and that is deliberate rather than
      # incidental. A path filtered step shows as skipped on a pull request
      # that touches nothing matching the filter, and a reviewer reading the
      # checks list cannot tell a skip from a pass. This runs on every pull
      # request and every push to main, and it reports counts either way.
      #
      # The one guard is by repository, which is the same guard the manifest
      # verification step carries and it is there for the same reason. "Use
      # this template" copies this workflow into somebody's own repository,
      # where their notes are shipped files by class and their releases are
      # their own business, and this step would go red for ever on a vault that
      # is working perfectly. On a pull request from a fork,
      # github.repository_id is still this repository's, so a contributor's
      # change is checked here.
      #
      # --release-branch only on a push to main, because a version that names
      # no tag is a release in preparation on a pull request and a debt on the
      # branch releases are cut from. Tagging does not re-trigger this workflow,
      # so the way to clear that red is to cut the tag and re-run this job.
      # The guard has the same skip-invisibility the comment above objects to in
      # a path filter, and saying so is better than pretending otherwise. Rename
      # or transfer this repository and this step skips for ever while the job
      # stays green. It is still the right guard, because the alternative is a
      # step that goes red for ever in somebody's vault, and the manifest step
      # above carries the same one. What makes it tolerable is that it names a
      # repository rather than a set of paths, so it changes only when somebody
      # moves the repository, and that is a thing a person does deliberately.
      #
      # LAST IN THE JOB, because its red is expected: every merge of a release
      # to main fails it until the tag is cut, and a failed step hides every
      # step after it. Nothing else here depends on its answer.
      #
      # THE TWO FAILING EXITS ARE SEPARATED. The script spends real effort
      # keeping 1, a release is owed, apart from 2, this check could not run and
      # is saying nothing, and a bare `run:` collapses both into "process
      # completed with exit code N". That matters most in the case that is
      # easiest to get wrong: drop fetch-depth and the answer becomes NO-TAGS on
      # 2, which looks like an ordinary red, and the usual response to a red
      # release check is to weaken it.
      - name: The release keeps up with what this template ships
        if: github.repository_id == '1368450026'
        run: |
          # The status is captured with `|| rc=$?` rather than read from $? on
          # the next line, because a workflow run block is bash -e and a bare
          # non-zero exit inside the if-body would end the step before anything
          # could look at it. A command on the left of || is exempt from that.
          rc=0
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            bash .github/release-check.sh --release-branch || rc=$?
          else
            bash .github/release-check.sh || rc=$?
          fi
          case "$rc" in
            0) exit 0 ;;
            1) echo "::error title=A release is owed::The tree ships something no published release carries. Read the output above, then cut the release as CONTRIBUTING.md describes."; exit 1 ;;
            2) echo "::error title=The release check could not run::This is NOT saying a release is owed and it is NOT saying one is not. Something stopped the check from answering, most often a checkout carrying no tags. Read the output above before changing anything."; exit 1 ;;
            *) echo "::error title=The release check failed unexpectedly::It left on $rc, which it does not document. Read the output above."; exit 1 ;;
          esac
